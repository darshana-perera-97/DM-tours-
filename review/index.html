<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - DM Tours</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="thank-you-container">
        <div class="thank-you-content">
            <div class="icon-wrapper">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h1 class="thank-you-title">Thank You!</h1>
            <p class="thank-you-message">
                We truly appreciate you taking the time to share your experience with us.
            </p>
            <p class="redirect-message">
                Redirecting you to Google Reviews in <span id="countdown">5</span> seconds...
            </p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <a href="#" id="reviewLink" class="review-button" style="display: none;">
                Continue to Google Reviews
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
